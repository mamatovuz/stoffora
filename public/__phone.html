<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>phone preview</title>
  </head>
  <body style="margin: 0; background: #2b2f36; padding: 8px">
    <iframe id="phone" src="/mini-app" style="width: 390px; height: 720px; border: 0; border-radius: 24px; background: #fff"></iframe>
    <script>
      window.__w = () => document.getElementById("phone").contentWindow;
      window.__click = (sel, text) => {
        const el = [...__w().document.querySelectorAll(sel)].find((e) => !text || e.textContent.trim().includes(text));
        if (!el) return false;
        el.click();
        return true;
      };
    </script>
  </body>
</html>
